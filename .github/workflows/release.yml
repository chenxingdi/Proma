# GitHub Actions: 自动打包分发（仅 Windows）
#
# 触发条件：推送 v* tag（如 v0.19.59）
# 只构建 Windows x64 产物并发布到 GitHub Releases。
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置。

name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许从 Actions 页面或 API 手动触发（用于补跑 / 只构建指定 tag）
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（如 v0.19.59）'
        required: true
        default: 'v0.19.59'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: build (windows-latest, win, x64, --x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 手动触发时检出指定 tag，保证发布到对应 Release
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（Windows x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: 打包并发布 (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
        working-directory: apps/electron
